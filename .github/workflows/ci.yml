name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Use the lockfile's npm version
        run: npm install --global npm@10.9.3 && test "$(npm --version)" = "10.9.3"
      - name: Install from the lockfile
        run: npm ci
      - name: Run type, test, build, contract, parity, and story gates
        run: npm run check
      - name: Verify the packed artifact and a clean consumer
        run: npm run check:package
      - name: Export the native Storybook bundle
        run: npm run storybook:export
