name: Publish Package

# Same release path as Bleecker, Brokaw and Giorgia: `npm version patch`
# then `git push --follow-tags`. The v* tag publishes to npm through
# trusted publishing (OIDC), so no npm token is stored in the repository.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: thompson
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@gaulatti'

      - name: Upgrade npm CLI for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Check the package
        run: npm run check:package

      - name: Publish
        # prepack runs `npm run check` (typecheck, build, tests, contracts, parity, stories).
        # NPM_TOKEN exists only for the first publish: npm trusted publishing can be
        # configured only on a package that already exists. Once the trusted publisher
        # is set, the secret is deleted and npm authenticates this workflow through OIDC.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Summary
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: @gaulatti/thompson" >> $GITHUB_STEP_SUMMARY
          VERSION=$(node -p 'require("./package.json").version')
          echo "- **Version**: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: npmjs" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Published" >> $GITHUB_STEP_SUMMARY
